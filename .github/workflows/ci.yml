name: Career Atlas CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-route-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Schema / evidence / SVG / site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate graph and source references
        run: python scripts/validate.py
      - name: Assert diagrams are reproducible
        run: node scripts/generate.mjs --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build pages
        run: python scripts/build.py
      - name: Smoke test compiled Pages
        run: python scripts/smoke.py
